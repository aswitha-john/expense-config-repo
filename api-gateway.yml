server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: expense-service
          uri: http://localhost:8082
          predicates:
            - Path=/expenses/**

        - id: report-service
          uri: http://localhost:8083
          predicates:
            - Path=/reports/**


logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
    gateway:
      enabled: true
